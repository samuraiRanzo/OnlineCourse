version: "3.9"

networks:
  learnforge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_files:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [ learnforge ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-learnforge}
      POSTGRES_USER: ${DB_USER:-learnforge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-learnforge_user} -d ${DB_NAME:-learnforge}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [ learnforge ]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: /home/ranzo/OnlineCourse/backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    networks: [ learnforge ]
    volumes:
      - media_files:/app/media
    env_file: .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn learnforge.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 300
               --access-logfile -
               --error-logfile -"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/users/needs-setup/')\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Celery Worker (video transcoding) ───────────────────────────────────────
  worker:
    build:
      context: /home/ranzo/OnlineCourse/backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    networks: [ learnforge ]
    volumes:
      - media_files:/app/media
    env_file: .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A learnforge worker --loglevel=info --concurrency=2

  # ── Nginx + Vue ─────────────────────────────────────────────────────────────
  web:
    build:
      context: /home/ranzo/OnlineCourse/frontend
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks: [ learnforge ]
    volumes:
      - media_files:/media:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
