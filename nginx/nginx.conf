server {
    listen 80;
    server_name _;

    # ── Vue SPA ───────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # All non-API, non-media routes → index.html (Vue Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Django API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large video uploads (teacher uploading a 2GB file)
        client_max_body_size 5G;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_request_buffering off;   # stream upload directly to Django
    }

    # ── Django admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static files (Django admin CSS/JS) ───────────────────────────────────
    location /static/ {
        proxy_pass http://api:8000;
    }

    # ── Media files (HLS video segments, thumbnails etc.) ────────────────────
    # Served directly from the shared media volume — nginx reads files,
    # Django is not involved in the response at all.
    location /media/ {
        alias /media/;

        # Cache segment files aggressively — they never change
        location ~* \.ts$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Never cache the playlist file
        location ~* \.m3u8$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store";
        }

        # Other media (thumbnails, uploads)
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/vnd.apple.mpegurl;
    gzip_min_length 1000;
}
